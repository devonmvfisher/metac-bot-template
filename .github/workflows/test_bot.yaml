name: Test Bot
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install poetry (3 tries)
        id: poetry
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if pipx install poetry==2.4.1; then
              poetry config virtualenvs.in-project true
              exit $?
            fi
            sleep 30
          done
          exit 1
      - name: Install dependencies (3 tries)
        id: install
        if: steps.poetry.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3; do poetry install --no-interaction --no-root && exit 0; sleep 30; done; exit 1
      - name: Run bot
        id: run
        continue-on-error: true
        timeout-minutes: 58
        if: steps.install.outcome == 'success'
        run: |
          poetry run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          USE_OPENAI_BRIDGE: ${{ vars.USE_OPENAI_BRIDGE }}
      - name: Ops
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.run.outcome }}" != "success" ]; then
            python3 -m fbot.ops --test-failed
            exit 1
          fi
          python3 -m fbot.ops --test
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MENTION: ${{ vars.ALERT_MENTION }}
